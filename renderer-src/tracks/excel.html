<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dojo Excel</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#F6F4EF;--panel:#FDFCFA;--sunk:#EFECE5;--line:#E3DED4;--text:#2F3437;--muted:#5E6569;--faint:#8A9195;--sage:#A8BFA3;--sage-ink:#4E6A49;--sage-tint:#E6EEE3;--slate:#6B8CAE;--slate-ink:#557496;--slate-text:#4F6E90;--slate-tint:#E4EBF2;--sand:#E6D5B8;--sand-tint:#F5EDE0;--sand-ink:#7A5F33;--terra:#97503B;--terra-tint:#F5E8E1;--editor:#FFFFFF;--gutter:#F8F6F2;--stripe:rgba(47,52,55,.025);--shadow:rgba(47,52,55,.05);--grid:#D9D5CB;--xl:#217346}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #6B8CAE;outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:rgba(120,128,132,.3);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
#app{display:flex;height:100%;min-height:0}
html.dojo-focus #side{display:none}
/* sidebar (shared look with the SQL track) */
#side{width:290px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#stats{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
#ringRow{display:flex;align-items:center;gap:14px}#ring{width:64px;height:64px;flex:none}
#solvedTitle{font-size:17px;font-weight:600}#solvedSub{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.lvl{display:grid;grid-template-columns:62px 1fr 44px;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-top:7px}
.bar{height:5px;border-radius:5px;background:var(--sunk);overflow:hidden}.bar>i{display:block;height:100%;background:var(--sage);border-radius:5px;transition:width .3s}
.lvl b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
#filters{padding:12px 14px 8px}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0}
.chips{display:flex;gap:5px;margin-top:10px}
.chip{height:28px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--slate-tint);border-color:transparent;color:var(--slate-text);font-weight:600}
select.sel{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 8px;font-size:13px;width:100%}
#list{flex:1;min-height:0;overflow:auto;padding:4px 10px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:0;background:transparent;font-size:14px}
.item:hover{background:var(--sunk)}.item.sel{background:var(--slate-tint)}
.dot{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--sage-ink)}
.dot.solved{background:var(--sage-tint);border-color:var(--sage)}.dot.attempted{border-color:var(--sand)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .df{font-size:12px;color:var(--muted)}
.df.Easy{color:var(--sage-ink)}.df.Medium{color:var(--sand-ink)}.df.Hard{color:var(--terra)}.df.Advanced{color:#7A4E8C}
#sideFoot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#sideFoot button{border:0;background:none;color:var(--slate-text);font-size:12px;font-weight:500;padding:4px 0}
/* main */
#main{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.6fr);gap:14px;padding:14px;min-height:0}
.panel{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px var(--shadow),0 8px 24px var(--shadow);overflow:hidden}
#phead{padding:16px 18px 0;flex:none}
#ptitle{display:flex;align-items:flex-start;gap:10px}#ptitle h1{margin:0;flex:1;min-width:0;font-size:18px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.navb{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}.navb:hover{background:var(--sunk)}
#badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.badge.d-Easy{background:var(--sage-tint);color:var(--sage-ink);font-weight:600}.badge.d-Medium{background:var(--sand-tint);color:var(--sand-ink);font-weight:600}
.badge.d-Hard{background:var(--terra-tint);color:var(--terra);font-weight:600}.badge.d-Advanced{background:#EDE6F2;color:#6B4580;font-weight:600}
.solvedpill{display:flex;align-items:center;gap:6px;color:var(--sage-ink);font-size:12.5px;font-weight:600;background:var(--sage-tint);padding:4px 10px;border-radius:999px;white-space:nowrap}
#tabs{display:flex;gap:20px;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 0 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--text);font-weight:600;border-bottom-color:var(--slate-ink)}
#pbody{flex:1;min-height:0;overflow:auto;padding:16px 18px 24px}
#pbody p{margin:0 0 14px;font-size:14.5px;line-height:1.7;color:var(--muted)}
.lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 8px}
.task{font-size:14.5px;line-height:1.65;color:var(--text);margin:0 0 12px}
.rules{display:flex;flex-wrap:wrap;gap:6px}.rule{font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.hintbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;height:30px;padding:0 12px;font-size:13px}
.hint{margin:8px 0 0;padding:10px 14px;border-radius:10px;background:var(--sand-tint);color:var(--sand-ink);font-size:13.5px;line-height:1.6;font-family:'JetBrains Mono',monospace;word-break:break-word}
.locked{text-align:center;padding:40px 16px;color:var(--muted)}.locked h2{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--text)}
.btn{height:32px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}.btn:disabled{opacity:.5;cursor:default}
.btn.submit{border:0;background:var(--slate-ink);color:#fff;font-weight:600;padding:0 16px}.btn.submit:hover{filter:brightness(1.07)}
.formula{margin:0 0 8px;padding:8px 12px;border-radius:9px;background:var(--sunk);font-family:'JetBrains Mono',monospace;font-size:12.5px;word-break:break-word}
.formula b{color:var(--slate-text)}
/* workbook window */
#wbwin{display:flex;flex-direction:column;min-width:0;min-height:0}
#titlebar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--xl);color:#fff;flex:none}
#titlebar .tt{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titlebar .btn{height:28px;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:12.5px}
#titlebar .btn:hover{background:rgba(255,255,255,.22)}
#titlebar .btn.submit{background:#fff;color:var(--xl);border:0}
#ribtabs{display:flex;gap:2px;padding:6px 10px 0;background:var(--sunk);flex:none}
.rt{height:28px;padding:0 14px;border:0;border-radius:6px 6px 0 0;background:transparent;font-size:13px;color:var(--muted)}
.rt[aria-selected=true]{background:var(--panel);color:var(--text);font-weight:600}
#ribbon{display:flex;gap:0;align-items:stretch;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;min-height:62px}
.grp{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 8px}
.grp:last-child{border-right:0}
.grp .row{display:flex;gap:2px;align-items:flex-start;flex-wrap:nowrap;flex:none}
.grp .gl{font-size:10.5px;color:var(--faint);text-align:center;padding-top:3px;margin-top:auto}
.grp{justify-content:flex-start}
.rb{height:26px;min-width:26px;padding:0 7px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.rb:hover{background:var(--sunk);border-color:var(--line)}
.rb.on{background:var(--slate-tint);border-color:var(--slate)}
.rb.big{height:50px;flex-direction:column;gap:1px;font-size:11px;padding:0 8px;line-height:1.15;text-align:center;justify-content:center}
.rb svg{pointer-events:none}
.sw{display:inline-block;width:14px;height:4px;border-radius:1px;margin-top:2px}
select.rsel{height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12.5px;padding:0 4px;max-width:130px}
#fbar{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
#nbox{width:96px;height:28px;border:0;border-right:1px solid var(--line);padding:0 8px;background:var(--panel);font-size:13px;text-align:center;outline:none}
#fx{width:34px;text-align:center;color:var(--muted);font-style:italic;font-family:serif;font-size:15px;border-right:1px solid var(--line);height:28px;line-height:28px}
#fin{flex:1;height:28px;border:0;padding:0 10px;background:var(--panel);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;min-width:0}
#gridWrap{flex:1;min-height:120px;position:relative;display:flex;min-width:0}
#gridScroll{flex:1;overflow:auto;position:relative;background:var(--editor);outline:none}
#gridInner{position:relative;display:inline-block;min-width:100%}
table.xl{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;background:var(--editor);position:relative}
table.xl th{position:sticky;top:0;z-index:3;height:24px;background:var(--gutter);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);font-weight:500;color:var(--muted);font-size:12px;user-select:none;padding:0;position:sticky}
table.xl th.rh{left:0;z-index:4;width:44px;min-width:44px;text-align:center}
table.xl th.ch{position:sticky;overflow:hidden}
table.xl th.sel,table.xl th.rh.sel{background:#d3e0ec;color:var(--text);font-weight:600}
.dark table.xl th.sel{background:#33475a}
.midnight table.xl th.sel{background:#2F3A5C}
th .rsz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:5}
table.xl td{height:22px;padding:0 5px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:clip;cursor:cell;background:var(--editor);position:relative}
table.xl td.wrap{white-space:normal;height:auto}
table.xl tr.h{display:none}
table.xl tbody th{position:sticky;left:0;z-index:2;height:22px;width:44px;background:var(--gutter);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);font-weight:400;font-size:12px;color:var(--muted)}
td.num{text-align:right}td.ctr{text-align:center}
td .bar{position:absolute;left:0;top:3px;bottom:3px;opacity:.55;border-radius:1px;pointer-events:none;background:#638EC6}
td .ar{position:absolute;right:0;top:0;bottom:0;width:17px;border:0;border-left:1px solid var(--grid);background:var(--gutter);font-size:9px;padding:0;color:var(--muted)}
td .fb{position:absolute;right:1px;top:2px;width:16px;height:16px;border:1px solid var(--grid);background:var(--gutter);font-size:8px;padding:0;color:var(--muted);border-radius:2px}
#selBox{position:absolute;border:2px solid var(--xl);background:rgba(33,115,70,.08);pointer-events:none;z-index:6}
#actBox{position:absolute;border:2px solid var(--xl);pointer-events:none;z-index:7}
#fillH{position:absolute;width:7px;height:7px;background:var(--xl);border:1px solid #fff;cursor:crosshair;z-index:8}
#antBox{position:absolute;border:2px dashed var(--xl);pointer-events:none;z-index:6;display:none}
#ced{position:absolute;z-index:9;border:2px solid var(--xl);padding:0 4px;font-family:inherit;font-size:13px;background:#fff;color:#111;outline:none;display:none}
.dark #ced{background:#222a30;color:#eee}
.midnight #ced{background:#1B1E2B;color:#E8EBF7}
.chartbox{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:5;overflow:hidden}
.chartbox .cx{position:absolute;right:4px;top:2px;border:0;background:none;color:var(--muted);font-size:14px;display:none;z-index:2}
.chartbox:hover .cx{display:block}
.chartbox .cdrag{position:absolute;left:0;right:0;top:0;height:22px;cursor:move}
#sheetbar{display:flex;align-items:center;gap:2px;padding:4px 8px;border-top:1px solid var(--line);background:var(--sunk);flex:none;overflow-x:auto}
.stab{height:26px;padding:0 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.stab[aria-selected=true]{color:var(--xl);font-weight:700;border-bottom:2px solid var(--xl)}
#addSheet{width:26px;height:26px;border-radius:50%;border:0;background:transparent;font-size:17px;color:var(--muted)}
#xstatus{display:flex;gap:16px;align-items:center;padding:3px 12px;background:var(--xl);color:#fff;font-size:11.5px;flex:none}
#xstatus span:last-child{margin-left:auto}
#xres{flex:none;max-height:38%;overflow:auto;border-top:1px solid var(--line);background:var(--panel)}
#xres .hd{padding:9px 14px;font-size:13.5px;font-weight:600}
#xres .hd.ok{background:var(--sage-tint);color:var(--sage-ink)}#xres .hd.bad{background:var(--terra-tint);color:var(--terra)}
#xres ul{list-style:none;margin:0;padding:6px 14px 10px}#xres li{font-size:13px;line-height:1.55;padding:3px 0;display:flex;gap:8px}
#xres li i{font-style:normal;font-weight:700;width:14px;flex:none}#xres li.ok i{color:var(--sage-ink)}#xres li.bad i{color:var(--terra)}#xres li.skip i{color:var(--faint)}
.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;min-width:160px;max-height:320px;overflow:auto;font-size:13px}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
.pop button:hover{background:var(--sunk)}.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop label{display:flex;gap:8px;align-items:center;padding:3px 8px}
.pop .grid{display:grid;grid-template-columns:repeat(8,18px);gap:3px;padding:6px}
.pop .grid i{width:18px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#scrim{position:fixed;inset:0;background:rgba(30,36,40,.4);z-index:50;display:none;align-items:center;justify-content:center}
#dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:430px;max-width:92vw;max-height:88vh;overflow:auto;padding:18px 20px}
#dlg h3{margin:0 0 12px;font-size:16px}
#dlg .f{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center;margin-bottom:12px;font-size:13px}
#dlg input[type=text],#dlg select,#dlg textarea{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 8px;width:100%;font-size:13px}
#dlg .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#dlg .note{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.5}
@media (max-width:1180px){#side{position:absolute;z-index:20;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}#app.drawer #side{transform:none}#main{grid-template-columns:minmax(0,1fr);overflow:auto;grid-auto-rows:minmax(640px,auto)}}
ul.notes{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--muted)}ul.notes li{margin:2px 0}
    #badgerow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    #badgerow #badges{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
    #badgerow .copyb:first-of-type{margin-left:auto}
    .copyb{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
    .copyb:hover{color:var(--text);background:var(--sunk)}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Questions">
    <div id="stats">
      <div id="ringRow">
        <svg id="ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle id="ringArc" cx="40" cy="40" r="34" fill="none" stroke="var(--sage)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 40 40)" stroke-dasharray="0 214"/></svg>
        <div><div id="solvedTitle">0 of 125 solved</div><div id="solvedSub">Solve one today to start a streak</div></div>
      </div>
      <div id="levels"></div>
    </div>
    <div id="filters">
      <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search questions" aria-label="Search questions"></label>
      <div class="chips" id="lvlChips" role="group" aria-label="Difficulty"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <select id="stSel" class="sel" aria-label="Filter by status"><option value="all">Any status</option><option value="todo">Not started</option><option value="attempted">Attempted</option><option value="solved">Solved</option></select>
        <select id="tgSel" class="sel" aria-label="Filter by topic"><option value="all">All topics</option></select>
      </div>
    </div>
    <nav id="list" aria-label="Question list"></nav>
    <div id="sideFoot"><span id="count">125 questions</span><button id="bankBtn" title="Run every reference solution against its own checks">Check question bank</button></div>
  </aside>

  <div id="main">
    <section class="panel" aria-label="Question">
      <div id="phead">
        <div id="ptitle">
          <h1 id="title"></h1><span id="solvedPill"></span>
          <div style="display:flex;gap:4px;flex:none">
            <button class="navb" id="prev" aria-label="Previous question"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="navb" id="next" aria-label="Next question"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
        <div id="badgerow">
          <div id="badges"></div>
          <button class="copyb" id="copyQ" aria-label="Copy the question as Markdown">Copy question</button>
          <button class="copyb" id="copyA" aria-label="Copy the question, my sheet and the result as Markdown">Copy + my sheet</button>
        </div>
        <div id="tabs" role="tablist" aria-label="Question sections">
          <button class="tab" role="tab" id="tabP" aria-selected="true">Question</button>
          <button class="tab" role="tab" id="tabS" aria-selected="false">Solutions <svg id="lock" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
        </div>
      </div>
      <div id="pbody"></div>
    </section>

    <section class="panel" id="wbwin" aria-label="Workbook">
      <div id="titlebar">
        <span class="tt" id="wbName">Book1</span>
        <button class="btn" id="openXl" title="Save this workbook as an .xlsx file and open it in Microsoft Excel">Open in Excel</button>
        <button class="btn" id="checkFile" title="Pick the .xlsx you saved from Excel and check it">Check my file</button>
        <button class="btn" id="resetBtn" title="Start this question again"><span id="resetLbl">Reset</span></button>
        <button class="btn submit" id="checkBtn" title="Check my answer (Ctrl+Enter)">Check</button>
      </div>
