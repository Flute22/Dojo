<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step through the solution</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
       font-family:Inter,system-ui,sans-serif;font-size:14px;overflow:hidden}
  header{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .src{font-size:12px;color:var(--muted);padding:3px 10px;border-radius:999px;background:var(--sunk)}
  .grow{flex:1}
  button{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
         font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit}
  button:hover:not(:disabled){background:var(--sunk)}
  button:disabled{opacity:.45;cursor:default}
  #pos{font-size:12.5px;color:var(--muted);min-width:116px;text-align:center;font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--slate)}
  #bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)}
  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:0}
  #codePane{min-height:0;overflow:auto;border-right:1px solid var(--line);padding:14px 0}
  .ln{display:flex;gap:10px;padding:1px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:20px;white-space:pre}
  .ln .n{color:var(--faint);text-align:right;width:22px;flex:none;user-select:none}
  .ln.on{background:var(--slate-tint)}
  .ln.on .n{color:var(--slate-text);font-weight:700}
  .ln.ret{background:var(--sage-tint)}
  #stage{position:relative;min-height:0;overflow:auto}
  #cols{display:flex;gap:40px;padding:16px 20px 28px;min-width:min-content}
  .col{display:flex;flex-direction:column;gap:12px;min-width:200px}
  .colhd{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .frame{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .frame>.t{padding:6px 10px;font-size:12px;font-weight:600;background:var(--sunk);border-bottom:1px solid var(--line)}
  .vars{display:flex;flex-direction:column}
  .v{display:flex;align-items:center;gap:8px;padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:12px}
  .v .k{color:var(--muted)}
  .v .val{color:var(--text)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--slate);flex:none}
  .v .dot{margin-left:auto}
  .cellbox .dot{margin:4px auto 1px}
  td .dot{margin:0 auto}
  .obj{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;max-width:520px}
  .obj>.t{padding:5px 10px;font-size:11px;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line);
          font-family:'JetBrains Mono',monospace}
  table{border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:11.5px}
  th,td{border:1px solid var(--line);padding:2px 7px;text-align:left;white-space:nowrap}
  th{background:var(--sunk);color:var(--muted);font-weight:600}
  td.ix{background:var(--sunk);color:var(--faint)}
  .items{display:flex;flex-wrap:wrap;gap:0;padding:8px 10px}
  .cellbox{border:1px solid var(--line);border-left-width:0;padding:3px 8px;font-family:'JetBrains Mono',monospace;font-size:11.5px}
  .cellbox:first-child{border-left-width:1px}
  .cellbox .i{display:block;font-size:9.5px;color:var(--faint);text-align:center}
  .more{padding:4px 10px;font-size:11px;color:var(--faint)}
  #wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
  #out{flex:none;border-top:1px solid var(--line);padding:8px 16px;font-family:'JetBrains Mono',monospace;
       font-size:11.5px;color:var(--muted);white-space:pre-wrap;max-height:100px;overflow:auto}
  #empty{padding:40px 20px;color:var(--muted);text-align:center}
  .warn{font-size:12px;color:var(--terra)}
</style>
</head>
<body>
  <header>
    <h1>Step through the solution</h1>
    <span class="src" id="srcLabel">—</span>
    <span class="warn" id="warn"></span>
    <span class="grow"></span>
    <span id="pos">—</span>
  </header>
  <div id="bar">
    <button id="first" title="First step">⏮</button>
    <button id="prev" title="Previous step">◀ Prev</button>
    <button id="next" title="Next step">Next ▶</button>
    <button id="last" title="Last step">⏭</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Step">
  </div>
  <main>
    <div id="codePane"></div>
    <div id="stage"><svg id="wires"></svg><div id="cols"></div></div>
  </main>
  <div id="out" hidden></div>
  <script src="visualize.js"></script>
</body>
</html>
